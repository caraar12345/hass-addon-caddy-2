name: "Build and deploy HA addon"

# Publishes the add-on for a version tag. Every step is safe to re-run for
# the same tag (e.g. after a failure part-way through, or a rotated secret):
# - images already on GHCR for this version aren't rebuilt;
# - the GitHub release is created only if it doesn't exist, and only after
#   the images are published, so a release means its images exist;
# - the add-on store bump is a no-op if the store already has this tag.
# Re-run with: gh workflow run build-and-deploy.yaml --ref <tag>

on:
  workflow_dispatch:

jobs:
  publish:
    permissions:
      contents: write
      packages: write
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v3

      - name: Check whether this version is already published
        id: published
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          published=true
          for arch in amd64 aarch64; do
            repo="${GITHUB_REPOSITORY}/caddy-2-${arch}"
            token=$(curl -fsS "https://ghcr.io/token?scope=repository:${repo}:pull" | jq -r .token)
            code=$(curl -s -o /dev/null -w '%{http_code}' -I \
              -H "Authorization: Bearer ${token}" \
              -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json' \
              "https://ghcr.io/v2/${repo}/manifests/${version}")
            echo "ghcr.io/${repo}:${version}: HTTP ${code}"
            # Anything but a confirmed 200 means build (and push) it.
            [ "$code" = 200 ] || published=false
          done
          echo "published=${published}" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        if: steps.published.outputs.published != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        if: steps.published.outputs.published != 'true'
        uses: home-assistant/builder@master
        with:
          args: |
            --aarch64 --amd64 \
            --target caddy-2 \
            --docker-hub ghcr.io/${{github.repository}} \
            --image caddy-2-{arch}

      - name: Create the GitHub release if it doesn't exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --silent 2> /dev/null; then
            echo "Release $TAG already exists."
          else
            gh release create "$TAG" --title "$TAG" --verify-tag --generate-notes
          fi

      - name: Repository Dispatch
        run: |
          echo "Triggering addon update in home-assistant-addons"
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/caraar12345/home-assistant-addons/dispatches \
            -f "event_type=addon_update" \
            -F "client_payload[addon]=caddy-2" \
            -F "client_payload[version]=${{ github.ref_name }}"
        env:
          GH_TOKEN: ${{ secrets.REPO_DISPATCH_PAT }}
