---
name: Follow upstream Caddy releases

# Keeps the add-on in step with caddyserver/caddy.
#
# GitHub sends no webhooks for releases in a repository you don't own, so this
# polls the latest stable release. When upstream is newer than the Dockerfile's
# CADDY_VERSION it:
#   1. bumps CADDY_VERSION in caddy-2/Dockerfile,
#   2. sets caddy-2/config.yaml's version to <caddy version>-aaroncarson.1,
#   3. commits to main and dispatches "Create tag for a new version", which
#      tags, builds and publishes the image and then bumps the submodule in
#      caraar12345/home-assistant-addons.
#
# The push uses GITHUB_TOKEN, and a GITHUB_TOKEN push doesn't start other
# workflows, so step 3 dispatches the tag workflow directly. workflow_dispatch
# is one of the events GITHUB_TOKEN may trigger.

on:
  schedule:
    # Scheduled runs are best-effort and can start late. Every 15 minutes is
    # about as often as is worth asking for.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      version:
        description: Caddy tag to move to (e.g. v2.11.9). Blank = latest stable release.
        required: false

concurrency:
  group: upstream-caddy
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main

      - name: Compare with upstream
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED: ${{ inputs.version }}
        run: |
          set -euo pipefail

          current=$(sed -nE 's/^ENV CADDY_VERSION="?(v[0-9][^"]*)"?.*/\1/p' caddy-2/Dockerfile)
          if [ -z "$current" ]; then
            echo "::error file=caddy-2/Dockerfile::couldn't read ENV CADDY_VERSION"
            exit 1
          fi

          if [ -n "${REQUESTED:-}" ]; then
            latest="$REQUESTED"
            # Fail early on a tag that has no release assets to download.
            gh api "repos/caddyserver/caddy/releases/tags/$latest" --jq .tag_name > /dev/null
          else
            # releases/latest skips drafts and pre-releases.
            latest=$(gh api repos/caddyserver/caddy/releases/latest --jq .tag_name)
          fi

          if ! [[ "$latest" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::upstream tag '$latest' isn't a plain vX.Y.Z release; not bumping"
            exit 1
          fi

          # The add-on version is <caddy version>-aaroncarson.N. If something
          # else (e.g. a Renovate PR) bumped CADDY_VERSION without it, the
          # add-on version still needs to catch up.
          addon_base=$(sed -nE 's/^version: *"?([0-9][0-9.]*).*/\1/p' caddy-2/config.yaml)

          echo "Dockerfile: $current, add-on: $addon_base, upstream: $latest"
          if [ -n "${REQUESTED:-}" ]; then
            target="$latest"
          else
            # Never move backwards.
            target=$(printf '%s\n%s\n' "$current" "$latest" | sort -V | tail -n1)
          fi

          if [ "$target" = "$current" ] && [ "$addon_base" = "${target#v}" ]; then
            # A bump whose release dispatch or tagging failed leaves main
            # ahead of its tag; release it now instead of skipping forever.
            addon_version=$(sed -nE 's/^version: *"?([^"[:space:]]+)"?.*/\1/p' caddy-2/config.yaml)
            if git ls-remote --exit-code --tags origin "refs/tags/v${addon_version}" > /dev/null; then
              # Tagged, so build-and-deploy was started; check it published
              # both images, directly on GHCR. Not re-dispatched: if the cause
              # persists (e.g. an expired secret) that would repeat every 15
              # minutes, so fail loudly instead (failed scheduled runs are
              # emailed); build-and-deploy is safe to re-run once it's fixed.
              missing="" unknown=""
              for arch in amd64 aarch64; do
                repo="${GITHUB_REPOSITORY}/caddy-2-${arch}"
                token=$(curl -fsS "https://ghcr.io/token?scope=repository:${repo}:pull" | jq -r .token)
                code=$(curl -s -o /dev/null -w '%{http_code}' -I \
                  -H "Authorization: Bearer ${token}" \
                  -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json' \
                  "https://ghcr.io/v2/${repo}/manifests/${addon_version}")
                case "$code" in
                  200) ;;
                  404) missing="$missing $arch" ;;
                  *) unknown="$unknown $arch(HTTP $code)" ;;
                esac
              done
              if [ -n "$unknown" ]; then
                echo "::error::couldn't confirm v${addon_version}'s image is published:${unknown}; will check again next run"
                exit 1
              fi
              if [ -n "$missing" ]; then
                echo "::error::v${addon_version} is tagged but its image isn't published for:${missing}. Fix the cause in its build-and-deploy run, then re-run it (safe to repeat): gh workflow run build-and-deploy.yaml --ref v${addon_version}"
                exit 1
              fi
              # build-and-deploy's last step bumps the add-on store's
              # submodule to the tag; check that happened too.
              tag_sha=$(git ls-remote origin "refs/tags/v${addon_version}^{}" "refs/tags/v${addon_version}" | awk 'NR==1 {print $1}')
              store_sha=$(gh api repos/caraar12345/home-assistant-addons/contents/caddy-2 --jq .sha) || {
                echo "::error::couldn't read the add-on store's caddy-2 submodule; will check again next run"
                exit 1
              }
              if [ "$store_sha" != "$tag_sha" ]; then
                echo "::error::v${addon_version} is published but the add-on store's caddy-2 submodule is at ${store_sha}, not ${tag_sha}. Fix the cause in its build-and-deploy run (often an expired REPO_DISPATCH_PAT), then re-run it (safe to repeat): gh workflow run build-and-deploy.yaml --ref v${addon_version}"
                exit 1
              fi
              echo "Up to date."
              echo "release=false" >> "$GITHUB_OUTPUT"
            else
              echo "::warning::v${addon_version} is on main but has no tag; dispatching its release"
              echo "release=true" >> "$GITHUB_OUTPUT"
            fi
            echo "bump=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "bump=true"
            echo "release=true"
            echo "current=$current"
            echo "latest=$target"
            echo "addon_version=${target#v}-aaroncarson.1"
          } >> "$GITHUB_OUTPUT"

      - name: Check the release has the binaries the Dockerfile downloads
        if: steps.check.outputs.bump == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.check.outputs.latest }}
        run: |
          set -euo pipefail
          assets=$(gh api "repos/caddyserver/caddy/releases/tags/$TAG" --jq '.assets[].name')
          for arch in amd64 arm64; do
            name="caddy_${TAG#v}_linux_${arch}.tar.gz"
            if ! grep -qx "$name" <<<"$assets"; then
              echo "::error::$TAG has no $name yet; will retry on the next run"
              exit 1
            fi
          done

      - name: Bump and push
        if: steps.check.outputs.bump == 'true'
        env:
          CURRENT: ${{ steps.check.outputs.current }}
          LATEST: ${{ steps.check.outputs.latest }}
          ADDON_VERSION: ${{ steps.check.outputs.addon_version }}
        run: |
          set -euo pipefail

          sed -i -E "s/^ENV CADDY_VERSION=.*/ENV CADDY_VERSION=\"${LATEST}\"/" caddy-2/Dockerfile
          sed -i -E "s/^version: .*/version: ${ADDON_VERSION}/" caddy-2/config.yaml
          git diff

          grep -qx "ENV CADDY_VERSION=\"${LATEST}\"" caddy-2/Dockerfile
          grep -qx "version: ${ADDON_VERSION}" caddy-2/config.yaml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "⬆️ Update caddyserver/caddy to ${LATEST}" \
            -m "https://github.com/caddyserver/caddy/releases/tag/${LATEST} (Dockerfile was ${CURRENT})"
          git push origin HEAD:main

      - name: Tag, build and publish
        if: steps.check.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run tag-and-setup-release.yml --ref main
